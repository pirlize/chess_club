<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <title>Chess Square</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Chess Square, σκακιστικό εντευκτήριο στους Αμπελοκήπους: σχολιασμένες παρτίδες, πρόγραμμα, νέα και βιβλία."
    />
    <!-- Members include juniors: keep the site out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chess Square" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply a saved theme before first paint to avoid a flash (see core/theme.ts).
      try {
        var theme = localStorage.getItem('cc:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to use the club app.</noscript>
  </body>
</html>
